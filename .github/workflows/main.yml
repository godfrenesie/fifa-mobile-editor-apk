name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Dézipper
        run: |
          mkdir unzipped
          for z in *.zip; do unzip -q "$z" -d unzipped; done
          P=$(find unzipped -name package.json -not -path '*/node_modules/*' | head -1)
          echo "APP_DIR=$(dirname "$P")" >> $GITHUB_ENV

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Compiler
        run: |
          cd "$APP_DIR"
          npm install
          npx cap add android
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="32" />\n    <application android:requestLegacyExternalStorage="true"#' $M
          npx cap sync android
          chmod +x android/gradlew
          cd android && ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: fifa-mobile-editor
          path: ${{ env.APP_DIR }}/android/app/build/outputs/apk/debug/app-debug.apk
